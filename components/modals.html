<div id="postModal" class="modal mt-5 p-4 hidden">
    <div class="glass p-6 rounded-2xl w-full overflow-y-auto" style="background: var(--bg-modl-c); border-color: var(--border);">
        <h2 class="text-lg font-bold mb-4 text-[var(--primary)]">✍️ Tulis Postingan</h2>
        <input type="text" id="postTitle" placeholder="Judul Artikel" class="w-full p-2 rounded mb-3 outline-none border border-[var(--border)] text-[var(--text-main)]" style="background: var(--bg-main);">
        <select id="postCategory" class="w-full p-2 rounded mb-3 outline-none border border-[var(--border)] text-xs text-[var(--text-soft)]" style="background: var(--bg-main);">
            <option value="Umum">Pilih Kategori: Umum</option>
            <option value="Kisah">Kisah</option>
            <option value="Sharaf">Sharaf</option>
            <option value="Nahu"> Nahu</option>
            <option value="Tauhid"> Tauhid</option>
            <option value="Fiqih"> Fiqih</option>
            <option value="Tashauf"> Tashauf</option>
            <option value="Hadist">Hadist</option>
            <option value="Renungan">Renungan</option>
            <option value="Tafsir">Tafsir</option>
        </select>
        <div class="flex gap-2 mb-3 flex-wrap">
            <!-- UPLOAD IMAGE -->
            <input
                type="file"
                id="imageUpload"
                accept="image/*"
                hidden
                onchange="handleImageUpload(event)">
            <button
                id="btnUploadImage"
                type="button"
                onclick="document.getElementById('imageUpload').click()"
                class="bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg transition-all shadow-sm"
            >
                🖼️ Upload Gambar
            </button>
             <!-- IMAGE OCR / PDF OCR -->
             <input
                type="file"
                id="ocrFile"
                accept="image/*,.pdf,.doc,.docx"
                class="hidden">
            <button
                type="button"
                onclick="FILE_PICKER_ACTIVE = true; document.getElementById('ocrFile').click();"
                class="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg transition-all shadow-sm"
            >
                🔍 Scan Gambar/PDF (OCR)
            </button>
            <span
                id="ocrStatus"
                class="text-[10px] text-[var(--text-soft)] italic self-center"></span>
        </div>
        <textarea id="postContent" placeholder="Isi konten..." rows="16" class="w-full min-h-[320px] max-h-[65vh] resize-y bg-slate-800 p-3 rounded-xl mb-4 outline-none border border-[var(--border)] text-xs text-[var(--text-main)]" style="background: var(--bg-main);"></textarea>
        <div class="flex gap-2">
            <button onclick="closeModal('postModal'); resetPostModal();" class="px-4 py-2 rounded-xl text-xs font-bold text-[var(--text-soft)] hover:opacity-80 transition-all" style="background: var(--bg-pop-itm);">Batal</button>
            <button onclick="submitPost()" id="btnSubmitPost" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-md transition-all">Terbitkan</button>
        </div>
    </div>
</div>
    
<div id="viewModal" class="modal mt-5 p-4 hidden">
    <div id="floatingAction" class="floating-actions">
        <button onclick="closeModal('viewModal')"  class="fab-btn"><img src="assets/icons/close.svg" class="icon"></button>
        <button id="btnSearch" class="fab-btn"><img src="assets/icons/search.svg" class="icon"></button>
        <button id="btnShare" class="fab-btn" title="Bagikan"><img src="assets/icons/share.svg" class="icon"></button>
        <button id="btnDownload" class="fab-btn" title="Download"><img src="assets/icons/download.svg" class="icon"></button>
        <button id="btnToc" class="fab-btn" title="Daftar Isi"><img src="assets/icons/menu.svg" class="icon"></button>
    </div>

    <div id="tocPopup" class="fab-popup hidden">
        <div class="fab-popup-inner" id="tocContainer"></div>
    </div>

    <div id="searchPopup" class="fab-popup hidden" style="background: var(--bg-pop-iner); border-color: var(--border);">
      <div class="fab-popup-inner">
        <div class="popup-title">Search in Post</div>
        
        <input
        id="searchInPost"
        type="text"
        placeholder="Cari kata..."
        class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-white outline-none"/>
      </div>
    </div>
    <div id="sharePopup" class="fab-popup hidden" style="background: var(--bg-pop-iner); border-color: var(--border);">
        <div class="fab-popup-inner">
            <div class="popup-title">Bagikan Link</div>
            <div class="popup-url">
                <input type="text" id="shareUrl" readonly>
                <button id="copyUrl" class="bg-blue-600 px-3 py-1 rounded text-[10px]">Salin</button>
            </div>
        </div>
    </div>

    <div id="downloadPopup" class="fab-popup hidden" style="background: var(--bg-pop-iner); border-color: var(--border);">
        <div class="fab-popup-inner">
            <div class="popup-title">Format Download</div>
            <button id="dlMd" class="popup-item">Markdown (.md)</button>
            <button id="dlHtml" class="popup-item">HTML (.html)</button>
            <button id="dlPdf" class="popup-item">PDF (.pdf)</button>
        </div>
    </div>

    <div class="glass p-6 rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
        <h2 id="viewTitle" class="text-xl font-bold mb-4 text-blue-400 text-center"></h2>
        <div id="viewContent" class="text-sm opacity-80 leading-loose mb-6"></div>
        <button onclick="closeModal('viewModal')" class="w-full py-2 rounded-lg text-xs mt-6 text-[var(--text-main)] font-medium transition-all hover:opacity-80" style="background: var(--bg-pop-itm); border: 1px solid var(--border);">Tutup</button>
    </div>
</div>
<div id="imageModal"
    class="modal hidden p-2 z-[9999]"
    onclick="closeImageModal()">

    <div
        class="relative max-w-6xl w-full flex justify-center">

        <img
            id="fullscreenImage"
            class="max-h-[92vh] max-w-full rounded-2xl shadow-2xl">

    </div>
</div>
