<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
async function loadComponent(id, path) {
    try {
        const res = await fetch(path);
        if (!res.ok) throw new Error(`Gagal muat ${path}`);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
    } catch (e) {
        console.error(e);
    }
}

async function initApp() {
    await Promise.all([
        loadComponent('comp-modals', 'components/modals.html'),
        loadComponent('comp-header', 'components/header.html'),
        loadComponent('comp-navigation', 'components/navigation.html'),
        loadComponent('section-blog', 'components/section-blog.html'),
        loadComponent('section-categories', 'components/section-categories.html'),
        loadComponent('section-archive', 'components/section-archive.html'),
        loadComponent('section-about', 'components/section-about.html'),
    ]);

    const scripts = [
        'assets/js/api.js',
        'assets/js/blog/config.js',
        'assets/js/blog/helpers.js',
        'assets/js/blog/search.js',
        'assets/js/blog/comments.js',
        'assets/js/blog/views.js',
        'assets/js/blog/bookmarks.js',
        'assets/js/blog/post-viewer.js',
        'assets/js/blog/post-crud.js',
        'assets/js/blog/categories.js',
        'assets/js/blog/archive.js',
        'assets/js/blog/blog-feed.js',
        'assets/js/blog/router.js',
        'assets/js/blog/fab.js',
        'assets/js/main.js',
    ];

    for (const src of scripts) {
        await new Promise(resolve => {
            const s = document.createElement('script');
            s.src = src
            s.onload = resolve;
            document.body.appendChild(s);
        });
    }

    if (typeof initBlog === "function") {
        initBlog();
    }

    if (typeof switchTab === "function") {
        switchTab('blog');
    }

    await refreshBlog();
    await refreshCategories();
}

initApp();
</script>
